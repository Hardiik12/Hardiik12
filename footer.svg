<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
<defs>

<!-- Background gradient -->
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%"  stop-color="#0B1020"/>
  <stop offset="35%" stop-color="#141B34"/>
  <stop offset="68%" stop-color="#1e1b4b"/>
  <stop offset="100%" stop-color="#0B1020"/>
</linearGradient>

<!-- Aurora radials -->
<radialGradient id="a1" cx="22%" cy="35%" r="50%">
  <stop offset="0%"   stop-color="#7C3AED" stop-opacity=".28"/>
  <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
</radialGradient>
<radialGradient id="a2" cx="78%" cy="68%" r="48%">
  <stop offset="0%"   stop-color="#2563EB" stop-opacity=".22"/>
  <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
</radialGradient>
<radialGradient id="a3" cx="58%" cy="18%" r="40%">
  <stop offset="0%"   stop-color="#4338CA" stop-opacity=".24"/>
  <stop offset="100%" stop-color="#4338CA" stop-opacity="0"/>
</radialGradient>

<!-- Card shine (top half) -->
<linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%"   stop-color="white" stop-opacity=".14"/>
  <stop offset="55%"  stop-color="white" stop-opacity=".03"/>
  <stop offset="100%" stop-color="white" stop-opacity="0"/>
</linearGradient>

<!-- Card drop-shadow/glow -->
<filter id="cg" x="-20%" y="-30%" width="140%" height="160%">
  <feDropShadow dx="0" dy="0"  stdDeviation="32" flood-color="#7C3AED" flood-opacity=".2"/>
  <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#4338CA" flood-opacity=".18"/>
</filter>

</defs>

<!-- ═══ BACKGROUND ═══ -->
<rect width="1600" height="500" fill="url(#bg)"/>
<rect width="1600" height="500" fill="url(#a1)"/>
<rect width="1600" height="500" fill="url(#a2)"/>
<rect width="1600" height="500" fill="url(#a3)"/>

<!-- Soft ambient blobs -->
<ellipse cx="240"  cy="165" rx="220" ry="110" fill="#7C3AED" opacity=".055"/>
<ellipse cx="1360" cy="338" rx="210" ry="105" fill="#2563EB" opacity=".065"/>
<ellipse cx="800"  cy="490" rx="340" ry="85"  fill="#4338CA" opacity=".05"/>
<ellipse cx="1100" cy="75"  rx="160" ry="65"  fill="#7C3AED" opacity=".05"/>

<!-- Stars -->
<circle cx="52"   cy="38"  r="1.2" fill="white" opacity=".38"/>
<circle cx="148"  cy="22"  r=".9"  fill="white" opacity=".28"/>
<circle cx="285"  cy="44"  r="1.3" fill="white" opacity=".32"/>
<circle cx="435"  cy="18"  r="1"   fill="white" opacity=".3"/>
<circle cx="525"  cy="36"  r=".8"  fill="white" opacity=".24"/>
<circle cx="685"  cy="28"  r="1.1" fill="white" opacity=".35"/>
<circle cx="825"  cy="12"  r=".9"  fill="white" opacity=".22"/>
<circle cx="1015" cy="42"  r="1.2" fill="white" opacity=".3"/>
<circle cx="1155" cy="22"  r="1"   fill="white" opacity=".32"/>
<circle cx="1305" cy="38"  r=".8"  fill="white" opacity=".24"/>
<circle cx="1448" cy="16"  r="1.1" fill="white" opacity=".35"/>
<circle cx="1558" cy="44"  r=".9"  fill="white" opacity=".22"/>
<circle cx="40"   cy="205" r=".9"  fill="white" opacity=".2"/>
<circle cx="95"   cy="450" r=".8"  fill="white" opacity=".24"/>
<circle cx="345"  cy="478" r="1.1" fill="white" opacity=".28"/>
<circle cx="705"  cy="490" r=".9"  fill="white" opacity=".22"/>
<circle cx="1058" cy="476" r="1"   fill="white" opacity=".24"/>
<circle cx="1258" cy="488" r=".8"  fill="white" opacity=".2"/>
<circle cx="1514" cy="460" r="1.1" fill="white" opacity=".3"/>
<circle cx="1582" cy="385" r=".9"  fill="white" opacity=".22"/>
<circle cx="1572" cy="132" r="1"   fill="white" opacity=".28"/>
<circle cx="205"  cy="172" r=".8"  fill="white" opacity=".22"/>
<circle cx="485"  cy="462" r="1"   fill="white" opacity=".24"/>
<circle cx="964"  cy="470" r=".9"  fill="white" opacity=".2"/>
<circle cx="1385" cy="132" r="1.1" fill="white" opacity=".3"/>
<circle cx="68"   cy="338" r=".9"  fill="white" opacity=".22"/>
<circle cx="1545" cy="298" r=".8"  fill="white" opacity=".2"/>
<circle cx="878"  cy="470" r="1"   fill="white" opacity=".24"/>
<circle cx="1458" cy="195" r=".7"  fill="white" opacity=".2"/>

<!-- ═══ BACK-LAYER ICONS ═══ -->

<!-- GitHub ── top-left -->
<g transform="translate(118,115)" opacity=".72">
  <animateTransform attributeName="transform" type="translate" additive="sum"
    values="0,0; 2,-9; -1,-5; 1,-7; 0,0" keyTimes="0;.25;.5;.75;1"
    dur="3s" repeatCount="indefinite" calcMode="spline"
    keySplines=".45,0,.55,1;.45,0,.55,1;.45,0,.55,1;.45,0,.55,1"/>
  <circle r="30" fill="#161B22" stroke="rgba(255,255,255,.2)" stroke-width="1.5"/>
  <!-- Octocat simplified -->
  <circle r="12" cy="-2" fill="white" opacity=".92"/>
  <path d="M-13,8 L-19,20" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M-7,14 L-9,22" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M7,14 L9,22"   stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M13,8 L19,20"  stroke="white" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- React ── top area left -->
<g transform="translate(198,58)" opacity=".78">
  <animateTransform attributeName="transform" type="translate" additive="sum"
    values="0,0; -2,-8; 1,-5; -1,-9; 0,0" keyTimes="0;.3;.55;.75;1"
    dur="3.8s" begin=".8s" repeatCount="indefinite" calcMode="spline"
    keySplines=".45,0,.55,1;.45,0,.55,1;.45,0,.55,1;.45,0,.55,1"/>
  <ellipse rx="27" ry="10.5" stroke="#61DAFB" stroke-width="2.8" fill="none"/>
  <ellipse rx="27" ry="10.5" stroke="#61DAFB" stroke-width="2.8" fill="none" transform="rotate(60)"/>
  <ellipse rx="27" ry="10.5" stroke="#61DAFB" stroke-width="2.8" fill="none" transform="rotate(120)"/>
  <circle r="4.5" fill="#61DAFB"/>
</g>

<!-- Python ── top center-left -->
<g transform="translate(408,58)" opacity=".72">
  <animateTransform attributeName="transform" type="translate" additive="sum"
    values="0,0; 1,-7; -2,-4; 0,0" keyTimes="0;.35;.7;1"
    dur="2.8s" begin="1.5s" repeatCount="indefinite" calcMode="spline"
    keySplines=".45,0,.55,1;.45,0,.55,1;.45,0,.55,1"/>
  <rect x="-15" y="-26" width="24" height="26" rx="12" fill="#3776AB"/>
  <rect x="-9"  y="0"   width="24" height="26" rx="12" fill="#FFD43B"/>
  <circle cx="-4" cy="-15" r="3.2" fill="white" opacity=".9"/>
  <circle cx="14" cy="15"  r="3.2" fill="white" opacity=".9"/>
  <line x1="9"  y1="-26" x2="9"  y2="-14" stroke="#FFD43B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="-15" y1="12" x2="-9" y2="12"  stroke="#3776AB" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- TypeScript ── left side -->
<g transform="translate(102,298)" opacity=".72">
  <animateTransform attributeName="transform" type="translate" additive="sum"
    values="0,0; -2,-9; 1,-5; -2,-7; 0,0" keyTimes="0;.28;.55;.75;1"
    dur="3.2s" begin=".3s" repeatCount="indefinite" calcMode="spline"
    keySplines=".45,0,.55,1;.45,0,.55,1;.45,0,.55,1;.45,0,.55,1"/>
  <rect x="-24" y="-24" width="48" height="48" rx="9" fill="#3178C6"/>
  <text x="0" y="10" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
    font-size="19" font-weight="700" fill="white">TS</text>
</g>

<!-- Flask ── bottom-left -->
<g transform="translate(155,400)" opacity=".65">
  <animateTransform attributeName="transform" type="translate" additive="sum"
    values="0,0; -1,-8; 2,-5; 0,0" keyTimes="0;.4;.7;1"
    dur="3.8s" begin="2s" repeatCount="indefinite" calcMode="spline"
    keySplines=".45,0,.55,1;.45,0,.55,1;.45,0,.55,1"/>
  <path d="M-8,-26 L-8,-7 L-22,18 Q-24,28 0,28 Q24,28 22,18 L8,-7 L8,-26 Z"
    stroke="rgba(255,255,255,.75)" stroke-width="2" fill="rgba(255,255,255,.07)"/>
  <line x1="-10" y1="-26" x2="10" y2="-26" stroke="rgba(255,255,255,.75)" stroke-width="2"/>
  <path d="M-18,14 Q-10,5 0,9 Q10,13 18,14 Q17,26 0,26 Q-17,26 -18,14 Z"
    fill="#60a5fa" opacity=".6"/>
  <circle cx="6" cy="2" r="2.5" fill="rgba(255,255,255,.4)"/>
</g>

<!-- Tailwind CSS ── bottom-left area -->
<g transform="translate(258,444)" opacity=".70">
  <animateTransform attributeName="transform" type="translate" additive="sum"
    values="0,0; 2,-7; -2,-4; 0,0" keyTimes="0;.45;.7;1"
    dur="3.5s" begin="3s" repeatCount="indefinite" calcMode="spline"
    keySplines=".45,0,.55,1;.45,0,.55,1;.45,0,.55,1"/>
  <circle r="26" fill="#0f172a" fill-opacity=".6" stroke="#06B6D4" stroke-width="1.8"/>
  <path d="M-16,2 Q-8,-12 0,2 Q8,16 16,2"
    stroke="#06B6D4" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M-16,-5 Q-8,-19 0,-5 Q8,9 16,-5"
    stroke="#06B6D4" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".5"/>
</g>

<!-- PostgreSQL ── top-right area -->
<g transform="translate(1218,62)" opacity=".68">
  <animateTransform attributeName="transform" type="translate" additive="sum"
    values="0,0; -1,-8; 2,-5; 0,0" keyTimes="0;.35;.7;1"
    dur="3.5s" begin="1.2s" repeatCount="indefinite" calcMode="spline"
    keySplines=".45,0,.55,1;.45,0,.55,1;.45,0,.55,1"/>
  <circle r="28" fill="#336791" fill-opacity=".9"/>
  <text x="0" y="-3" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
    font-size="10" font-weight="700" fill="white">POST</text>
  <text x="0" y="11" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
    font-size="10" font-weight="700" fill="white">GRES</text>
  <path d="M-9,-22 Q-14,-27 -16,-22" stroke="white" stroke-width="2" fill="none" opacity=".55"/>
</g>

<!-- Next.js ── top-right corner -->
<g transform="translate(1455,88)" opacity=".75">
  <animateTransform attributeName="transform" type="translate" additive="sum"
    values="0,0; 1,-8; -2,-5; 1,-7; 0,0" keyTimes="0;.25;.5;.75;1"
    dur="2.8s" begin="2.5s" repeatCount="indefinite" calcMode="spline"
    keySplines=".45,0,.55,1;.45,0,.55,1;.45,0,.55,1;.45,0,.55,1"/>
  <circle r="28" fill="#111" stroke="rgba(255,255,255,.18)" stroke-width="1.5"/>
  <text x="0" y="10" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
    font-size="26" font-weight="700" fill="white">N</text>
</g>

<!-- Express ── far right -->
<g transform="translate(1510,252)" opacity=".62">
  <animateTransform attributeName="transform" type="translate" additive="sum"
    values="0,0; -3,-9; 2,-5; 0,0" keyTimes="0;.4;.7;1"
    dur="4s" begin=".7s" repeatCount="indefinite" calcMode="spline"
    keySplines=".45,0,.55,1;.45,0,.55,1;.45,0,.55,1"/>
  <circle r="25" fill="#333" fill-opacity=".8" stroke="rgba(255,255,255,.15)" stroke-width="1.2"/>
  <text x="0" y="6" text-anchor="middle" font-family="monospace"
    font-size="13" letter-spacing="1.5" fill="rgba(255,255,255,.9)">ex</text>
</g>

<!-- Prisma ── right-bottom -->
<g transform="translate(1478,378)" opacity=".65">
  <animateTransform attributeName="transform" type="translate" additive="sum"
    values="0,0; -2,-8; 1,-5; -3,-7; 0,0" keyTimes="0;.28;.55;.78;1"
    dur="4.2s" begin="2.2s" repeatCount="indefinite" calcMode="spline"
    keySplines=".45,0,.55,1;.45,0,.55,1;.45,0,.55,1;.45,0,.55,1"/>
  <polygon points="0,-28 24,14 -24,14" stroke="#818CF8" stroke-width="2" fill="rgba(129,140,248,.18)"/>
  <polygon points="0,-12 10,6 -10,6" fill="#818CF8" opacity=".7"/>
</g>

<!-- ═══ GLASS CARD ═══ -->
<g filter="url(#cg)">
  <rect x="490" y="100" width="620" height="300" rx="28"
    fill="rgba(255,255,255,.076)" stroke="rgba(255,255,255,.1)" stroke-width="1"/>
  <!-- Top inner shine -->
  <rect x="491" y="101" width="618" height="150" rx="28" fill="url(#shine)"/>
</g>
<!-- Accent line on card top-center -->
<rect x="670" y="100" width="260" height="1.5" rx=".75" fill="rgba(139,92,246,.65)"/>

<!-- ═══ CARD TEXT (fade-in via SMIL) ═══ -->
<g opacity="0">
  <animate attributeName="opacity" values="0;0;1" keyTimes="0;.15;1" dur="2.2s" fill="freeze"/>

  <!-- Title -->
  <text x="800" y="152" text-anchor="middle"
    font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500"
    letter-spacing="5" fill="rgba(255,255,255,.52)">&#x1F680;  THANKS FOR VISITING</text>

  <!-- Divider under title -->
  <line x1="695" y1="166" x2="905" y2="166" stroke="rgba(255,255,255,.09)" stroke-width=".8"/>

  <!-- Quote text -->
  <text x="800" y="210" text-anchor="middle"
    font-family="Arial,Helvetica,sans-serif" font-size="23" fill="rgba(255,255,255,.8)" letter-spacing=".3">
    Great software starts with curiosity,</text>
  <text x="800" y="244" text-anchor="middle"
    font-family="Arial,Helvetica,sans-serif" font-size="23" fill="rgba(255,255,255,.8)" letter-spacing=".3">
    grows through consistency,</text>
  <text x="800" y="278" text-anchor="middle"
    font-family="Arial,Helvetica,sans-serif" font-size="23" fill="rgba(255,255,255,.8)" letter-spacing=".3">
    and creates impact through action.</text>

  <!-- Divider -->
  <line x1="726" y1="300" x2="874" y2="300" stroke="rgba(255,255,255,.12)" stroke-width=".8"/>

  <!-- Attribution with slow pulse -->
  <text x="800" y="327" text-anchor="middle"
    font-family="Arial,Helvetica,sans-serif" font-size="15" font-style="italic"
    fill="rgba(255,255,255,.4)" letter-spacing="1">&#8212; Hardik Gupta
    <animate attributeName="opacity" values="1;.65;1" dur="3.5s" begin="2.5s" repeatCount="indefinite"/>
  </text>
</g>

<!-- ═══ FRONT-LAYER ICONS ═══ -->

<!-- Node.js ── bottom-right -->
<g transform="translate(1408,420)" opacity=".75">
  <animateTransform attributeName="transform" type="translate" additive="sum"
    values="0,0; 1,-9; -2,-5; 2,-8; 0,0" keyTimes="0;.25;.5;.75;1"
    dur="3s" begin="1.8s" repeatCount="indefinite" calcMode="spline"
    keySplines=".45,0,.55,1;.45,0,.55,1;.45,0,.55,1;.45,0,.55,1"/>
  <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="#339933"/>
  <text x="0" y="10" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
    font-size="20" font-weight="700" fill="white">N</text>
</g>

<!-- Java ── bottom-center -->
<g transform="translate(730,452)" opacity=".70">
  <animateTransform attributeName="transform" type="translate" additive="sum"
    values="0,0; 3,-8; -1,-5; 0,0" keyTimes="0;.45;.7;1"
    dur="2.5s" begin=".5s" repeatCount="indefinite" calcMode="spline"
    keySplines=".45,0,.55,1;.45,0,.55,1;.45,0,.55,1"/>
  <rect x="-18" y="-14" width="28" height="27" rx="5" fill="#5382A1"/>
  <path d="M10,-10 Q25,-10 22,5 Q20,16 10,13"
    stroke="#F89820" stroke-width="3" fill="none" stroke-linecap="round"/>
  <rect x="-18" y="16" width="28" height="4" rx="2" fill="#F89820"/>
  <text x="-4" y="8" text-anchor="middle"
    font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="white">J</text>
</g>

</svg>
