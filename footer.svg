<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
<defs>
<style>
.f1{animation:fl1 7s ease-in-out infinite}
.f2{animation:fl2 8.5s ease-in-out infinite .8s}
.f3{animation:fl3 6.5s ease-in-out infinite 1.5s}
.f4{animation:fl4 9s ease-in-out infinite 2s}
.f5{animation:fl5 7.5s ease-in-out infinite .3s}
.f6{animation:fl6 8s ease-in-out infinite 1.2s}
.f7{animation:fl1 6.8s ease-in-out infinite 2.5s}
.f8{animation:fl2 9.5s ease-in-out infinite .7s}
.f9{animation:fl3 7.2s ease-in-out infinite 1.8s}
.f10{animation:fl4 8.2s ease-in-out infinite 3s}
.f11{animation:fl5 6.3s ease-in-out infinite .5s}
.f12{animation:fl6 9.8s ease-in-out infinite 2.2s}
@keyframes fl1{0%,100%{transform:translate(0,0) rotate(0deg)}33%{transform:translate(2px,-7px) rotate(1.5deg)}66%{transform:translate(-1px,-4px) rotate(-1deg)}}
@keyframes fl2{0%,100%{transform:translate(0,0) rotate(0deg)}40%{transform:translate(-3px,-9px) rotate(-2deg)}70%{transform:translate(2px,-5px) rotate(1deg)}}
@keyframes fl3{0%,100%{transform:translate(0,0) rotate(0deg)}30%{transform:translate(1px,-6px) rotate(2.5deg)}60%{transform:translate(-2px,-3px) rotate(-.5deg)}}
@keyframes fl4{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(-2px,-8px) rotate(-2.5deg)}}
@keyframes fl5{0%,100%{transform:translate(0,0) rotate(0deg)}45%{transform:translate(3px,-7px) rotate(1deg)}75%{transform:translate(-1px,-4px) rotate(-1.5deg)}}
@keyframes fl6{0%,100%{transform:translate(0,0) rotate(0deg)}35%{transform:translate(-3px,-6px) rotate(2deg)}65%{transform:translate(1px,-9px) rotate(-2deg)}}
</style>

<!-- Background gradient -->
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#0B1020"/>
  <stop offset="35%" stop-color="#141B34"/>
  <stop offset="68%" stop-color="#1e1b4b"/>
  <stop offset="100%" stop-color="#0B1020"/>
</linearGradient>

<!-- Aurora radial glows -->
<radialGradient id="a1" cx="22%" cy="35%" r="50%">
  <stop offset="0%" stop-color="#7C3AED" stop-opacity=".22"/>
  <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
</radialGradient>
<radialGradient id="a2" cx="78%" cy="68%" r="48%">
  <stop offset="0%" stop-color="#2563EB" stop-opacity=".18"/>
  <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
</radialGradient>
<radialGradient id="a3" cx="58%" cy="18%" r="40%">
  <stop offset="0%" stop-color="#4338CA" stop-opacity=".2"/>
  <stop offset="100%" stop-color="#4338CA" stop-opacity="0"/>
</radialGradient>
<radialGradient id="a4" cx="50%" cy="50%" r="35%">
  <stop offset="0%" stop-color="#7C3AED" stop-opacity=".07"/>
  <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
</radialGradient>

<!-- Card glass shine gradient -->
<linearGradient id="card-shine" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="white" stop-opacity=".12"/>
  <stop offset="45%" stop-color="white" stop-opacity=".03"/>
  <stop offset="100%" stop-color="white" stop-opacity="0"/>
</linearGradient>

<!-- Card glow filter -->
<filter id="card-glow" x="-25%" y="-40%" width="150%" height="180%">
  <feDropShadow dx="0" dy="0" stdDeviation="28" flood-color="#7C3AED" flood-opacity=".18"/>
  <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#312E81" flood-opacity=".25"/>
</filter>

<!-- Soft blur filter for blob backgrounds -->
<filter id="blob-blur">
  <feGaussianBlur stdDeviation="40"/>
</filter>
<filter id="blob-blur2">
  <feGaussianBlur stdDeviation="28"/>
</filter>

<!-- Icon soft glow filter -->
<filter id="icon-glow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="5" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<!-- Slightly more blur for distant icons -->
<filter id="icon-far" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="1.8" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>

<!-- Noise texture -->
<filter id="noise" x="0%" y="0%" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" stitchTiles="stitch" result="n"/>
  <feColorMatrix type="saturate" values="0" in="n" result="gn"/>
  <feBlend in="SourceGraphic" in2="gn" mode="overlay" result="bl"/>
  <feComposite in="bl" in2="SourceGraphic" operator="in"/>
</filter>
</defs>

<!-- ══════════ BACKGROUND ══════════ -->
<rect width="1600" height="500" fill="url(#bg)"/>

<!-- Aurora overlays -->
<rect width="1600" height="500" fill="url(#a1)"/>
<rect width="1600" height="500" fill="url(#a2)"/>
<rect width="1600" height="500" fill="url(#a3)"/>
<rect width="1600" height="500" fill="url(#a4)"/>

<!-- Ambient light blobs -->
<ellipse cx="260" cy="160" rx="220" ry="110" fill="#7C3AED" opacity=".07" filter="url(#blob-blur)"/>
<ellipse cx="1340" cy="340" rx="200" ry="100" fill="#2563EB" opacity=".08" filter="url(#blob-blur)"/>
<ellipse cx="800" cy="480" rx="300" ry="80" fill="#4338CA" opacity=".06" filter="url(#blob-blur)"/>
<ellipse cx="1100" cy="80" rx="150" ry="60" fill="#7C3AED" opacity=".06" filter="url(#blob-blur2)"/>
<ellipse cx="450" cy="400" rx="130" ry="60" fill="#312E81" opacity=".07" filter="url(#blob-blur2)"/>

<!-- Noise overlay for texture -->
<rect width="1600" height="500" fill="white" opacity=".02" filter="url(#noise)"/>

<!-- ══════════ STARS / PARTICLES ══════════ -->
<circle cx="52" cy="38" r=".9" fill="white" opacity=".35"/>
<circle cx="143" cy="22" r=".7" fill="white" opacity=".25"/>
<circle cx="280" cy="45" r="1.1" fill="white" opacity=".3"/>
<circle cx="430" cy="18" r=".8" fill="white" opacity=".28"/>
<circle cx="520" cy="35" r=".6" fill="white" opacity=".22"/>
<circle cx="680" cy="28" r=".9" fill="white" opacity=".32"/>
<circle cx="820" cy="12" r=".7" fill="white" opacity=".2"/>
<circle cx="1010" cy="42" r="1" fill="white" opacity=".28"/>
<circle cx="1150" cy="20" r=".8" fill="white" opacity=".3"/>
<circle cx="1300" cy="38" r=".6" fill="white" opacity=".22"/>
<circle cx="1440" cy="15" r=".9" fill="white" opacity=".32"/>
<circle cx="1555" cy="44" r=".7" fill="white" opacity=".2"/>
<circle cx="38" cy="200" r=".8" fill="white" opacity=".18"/>
<circle cx="90" cy="450" r=".6" fill="white" opacity=".22"/>
<circle cx="340" cy="480" r=".9" fill="white" opacity=".25"/>
<circle cx="700" cy="490" r=".7" fill="white" opacity=".2"/>
<circle cx="1050" cy="475" r=".8" fill="white" opacity=".22"/>
<circle cx="1250" cy="488" r=".6" fill="white" opacity=".18"/>
<circle cx="1510" cy="460" r=".9" fill="white" opacity=".28"/>
<circle cx="1580" cy="380" r=".7" fill="white" opacity=".2"/>
<circle cx="1570" cy="130" r=".8" fill="white" opacity=".25"/>
<circle cx="1480" cy="200" r=".5" fill="white" opacity=".18"/>
<circle cx="200" cy="170" r=".6" fill="white" opacity=".2"/>
<circle cx="480" cy="460" r=".8" fill="white" opacity=".22"/>
<circle cx="960" cy="468" r=".7" fill="white" opacity=".18"/>
<circle cx="1380" cy="130" r=".9" fill="white" opacity=".28"/>
<circle cx="65" cy="335" r=".7" fill="white" opacity=".2"/>
<circle cx="1540" cy="295" r=".6" fill="white" opacity=".18"/>

<!-- ══════════ BACK-LAYER ICONS (behind card) ══════════ -->

<!-- GitHub — top-left corner -->
<g class="f1" transform="translate(88,108)" opacity=".23" filter="url(#icon-far)">
  <circle r="23" fill="#161B22" stroke="rgba(255,255,255,.12)" stroke-width="1.2"/>
  <circle r="9.5" cy="-1" fill="white" opacity=".9"/>
  <path d="M-10,7 L-15,16" stroke="white" stroke-width="2" stroke-linecap="round" opacity=".75"/>
  <path d="M-5,11 L-7,18" stroke="white" stroke-width="2" stroke-linecap="round" opacity=".75"/>
  <path d="M5,11 L7,18" stroke="white" stroke-width="2" stroke-linecap="round" opacity=".75"/>
  <path d="M10,7 L15,16" stroke="white" stroke-width="2" stroke-linecap="round" opacity=".75"/>
</g>

<!-- React — top-left area -->
<g class="f2" transform="translate(178,62)" opacity=".3" filter="url(#icon-glow)">
  <ellipse rx="24" ry="9.5" stroke="#61DAFB" stroke-width="2" fill="none"/>
  <ellipse rx="24" ry="9.5" stroke="#61DAFB" stroke-width="2" fill="none" transform="rotate(60)"/>
  <ellipse rx="24" ry="9.5" stroke="#61DAFB" stroke-width="2" fill="none" transform="rotate(120)"/>
  <circle r="4" fill="#61DAFB"/>
</g>

<!-- Python — top area, left-center -->
<g class="f3" transform="translate(395,70)" opacity=".26" filter="url(#icon-far)">
  <rect x="-14" y="-24" width="22" height="24" rx="11" fill="#3776AB"/>
  <rect x="-8" y="0" width="22" height="24" rx="11" fill="#FFD43B"/>
  <circle cx="-3" cy="-14" r="2.8" fill="white" opacity=".9"/>
  <circle cx="13" cy="14" r="2.8" fill="white" opacity=".9"/>
  <line x1="8" y1="-24" x2="8" y2="-14" stroke="#FFD43B" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="-14" y1="10" x2="-8" y2="10" stroke="#3776AB" stroke-width="2.2" stroke-linecap="round"/>
</g>

<!-- TypeScript — left side -->
<g class="f5" transform="translate(88,295)" opacity=".26" filter="url(#icon-far)">
  <rect x="-22" y="-22" width="44" height="44" rx="8" fill="#3178C6"/>
  <text x="0" y="9" text-anchor="middle" font-family="'SF Pro Display',Inter,system-ui,sans-serif" font-size="16" font-weight="700" fill="white">TS</text>
</g>

<!-- Flask — bottom-left -->
<g class="f4" transform="translate(148,388)" opacity=".2" filter="url(#icon-far)">
  <path d="M-7,-22 L-7,-6 L-20,16 Q-22,24 0,24 Q22,24 20,16 L7,-6 L7,-22 Z" stroke="rgba(255,255,255,.65)" stroke-width="1.5" fill="rgba(255,255,255,.05)"/>
  <line x1="-9" y1="-22" x2="9" y2="-22" stroke="rgba(255,255,255,.65)" stroke-width="1.5"/>
  <path d="M-16,12 Q-10,4 0,8 Q10,12 16,12 Q15,22 0,22 Q-15,22 -16,12 Z" fill="#60a5fa" opacity=".5"/>
  <circle cx="5" cy="2" r="2" fill="rgba(255,255,255,.3)"/>
</g>

<!-- Tailwind CSS — bottom-left area -->
<g class="f10" transform="translate(232,432)" opacity=".25" filter="url(#icon-glow)">
  <circle r="23" fill="#0f172a" fill-opacity=".5" stroke="#06B6D4" stroke-width="1.2"/>
  <path d="M-14,2 Q-7,-10 0,2 Q7,14 14,2" stroke="#06B6D4" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M-14,-5 Q-7,-17 0,-5 Q7,7 14,-5" stroke="#06B6D4" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".55"/>
</g>

<!-- PostgreSQL — top-right area -->
<g class="f6" transform="translate(1195,62)" opacity=".23" filter="url(#icon-far)">
  <circle r="23" fill="#336791" fill-opacity=".88"/>
  <text x="0" y="-2" text-anchor="middle" font-family="'SF Pro Display',Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="white" opacity=".9">POST</text>
  <text x="0" y="10" text-anchor="middle" font-family="'SF Pro Display',Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="white" opacity=".9">GRES</text>
  <!-- Elephant tusk hint -->
  <path d="M-8,-18 Q-12,-22 -14,-18" stroke="white" stroke-width="1.5" fill="none" opacity=".5"/>
</g>

<!-- Next.js — top-right corner -->
<g class="f7" transform="translate(1450,85)" opacity=".28" filter="url(#icon-far)">
  <circle r="23" fill="#000" fill-opacity=".82" stroke="rgba(255,255,255,.14)" stroke-width="1.2"/>
  <text x="0" y="8" text-anchor="middle" font-family="'SF Pro Display',Inter,system-ui,sans-serif" font-size="20" font-weight="700" fill="white">N</text>
</g>

<!-- Express — far right -->
<g class="f8" transform="translate(1508,248)" opacity=".2" filter="url(#icon-far)">
  <circle r="21" fill="#353535" fill-opacity=".7" stroke="rgba(255,255,255,.1)" stroke-width="1"/>
  <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="1" fill="rgba(255,255,255,.85)">ex</text>
</g>

<!-- Prisma — right side -->
<g class="f12" transform="translate(1478,368)" opacity=".22" filter="url(#icon-far)">
  <polygon points="0,-24 21,12 -21,12" stroke="#818CF8" stroke-width="1.5" fill="rgba(129,140,248,.12)"/>
  <polygon points="0,-10 9,5 -9,5" fill="#818CF8" opacity=".6"/>
</g>

<!-- ══════════ GLASS CARD ══════════ -->
<g filter="url(#card-glow)">
  <!-- Main card body -->
  <rect x="570" y="143" width="460" height="214" rx="28" ry="28"
    fill="rgba(255,255,255,.072)" stroke="rgba(255,255,255,.09)" stroke-width="1"/>
  <!-- Inner top shine -->
  <rect x="571" y="144" width="458" height="107" rx="28" ry="28"
    fill="url(#card-shine)"/>
  <!-- Subtle bottom inner border -->
  <line x1="610" y1="356" x2="990" y2="356" stroke="rgba(255,255,255,.04)" stroke-width="1"/>
</g>

<!-- Card top accent line -->
<rect x="680" y="143" width="240" height="1.2" rx=".6" fill="rgba(139,92,246,.55)"/>

<!-- Card content -->
<!-- Rocket emoji + title -->
<text x="800" y="188" text-anchor="middle"
  font-family="'SF Pro Display',Inter,system-ui,sans-serif"
  font-size="13" font-weight="500" letter-spacing="3.5" fill="rgba(255,255,255,.5)">🚀  THANKS FOR VISITING</text>

<!-- Thin separator -->
<line x1="700" y1="200" x2="900" y2="200" stroke="rgba(255,255,255,.08)" stroke-width=".8"/>

<!-- Quote lines -->
<text x="800" y="228" text-anchor="middle"
  font-family="'SF Pro Display',Inter,system-ui,sans-serif"
  font-size="15.5" fill="rgba(255,255,255,.72)" letter-spacing=".3">Great software starts with curiosity,</text>
<text x="800" y="252" text-anchor="middle"
  font-family="'SF Pro Display',Inter,system-ui,sans-serif"
  font-size="15.5" fill="rgba(255,255,255,.72)" letter-spacing=".3">grows through consistency,</text>
<text x="800" y="276" text-anchor="middle"
  font-family="'SF Pro Display',Inter,system-ui,sans-serif"
  font-size="15.5" fill="rgba(255,255,255,.72)" letter-spacing=".3">and creates impact through action.</text>

<!-- Divider line in card -->
<line x1="720" y1="294" x2="880" y2="294" stroke="rgba(255,255,255,.1)" stroke-width=".8"/>

<!-- Attribution -->
<text x="800" y="320" text-anchor="middle"
  font-family="'SF Pro Display',Inter,system-ui,sans-serif"
  font-size="12.5" fill="rgba(255,255,255,.38)" font-style="italic" letter-spacing=".8">— Hardik Gupta</text>

<!-- ══════════ FRONT-LAYER ICONS (in front of card) ══════════ -->

<!-- Node.js — bottom-right, partially in front -->
<g class="f9" transform="translate(1398,408)" opacity=".27" filter="url(#icon-glow)">
  <polygon points="0,-25 21.6,-12.5 21.6,12.5 0,25 -21.6,12.5 -21.6,-12.5" fill="#339933"/>
  <text x="0" y="8" text-anchor="middle" font-family="'SF Pro Display',Inter,system-ui,sans-serif" font-size="16" font-weight="700" fill="white">N</text>
</g>

<!-- Java — bottom-center area, floating in front -->
<g class="f11" transform="translate(718,448)" opacity=".25" filter="url(#icon-glow)">
  <rect x="-16" y="-12" width="26" height="24" rx="4" fill="#5382A1"/>
  <path d="M10,-8 Q22,-8 20,4 Q18,13 10,11" stroke="#F89820" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <rect x="-16" y="14" width="26" height="3.5" rx="1.8" fill="#F89820"/>
  <text x="-3" y="7" text-anchor="middle"
    font-family="'SF Pro Display',Inter,system-ui,sans-serif"
    font-size="13" font-weight="700" fill="white">J</text>
</g>

</svg>
